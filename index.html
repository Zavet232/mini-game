<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Runner 3D — Ultimate Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #090a0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            z-index: 10;
            background: rgba(15, 20, 35, 0.65);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(5px);
        }
        #score-val { color: #00ffcc; font-size: 24px; }
        #coins-val { color: #ffd700; font-size: 24px; }

        #powerups-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .badge {
            display: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            color: #090a0f;
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
        }
        #magnet-badge { background: #00b8ff; }
        #shield-badge { background: #00ff66; }

        #sound-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 20, 35, 0.7);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            z-index: 15;
        }
        
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(12, 14, 24, 0.94);
            border: 2px solid #ff2a6d;
            border-radius: 18px;
            padding: 35px 55px;
            text-align: center;
            color: white;
            z-index: 20;
            box-shadow: 0 0 45px rgba(255, 42, 109, 0.5);
            backdrop-filter: blur(8px);
        }
        #game-over h1 { margin-top: 0; color: #ff2a6d; letter-spacing: 2px; }
        .restart-btn {
            background: linear-gradient(45deg, #00ffcc, #00b8ff);
            color: #090a0f;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div id="ui">
    <div>СЧЁТ: <span id="score-val">0</span></div>
    <div>МОНЕТЫ: <span id="coins-val">0</span></div>
</div>

<div id="powerups-ui">
    <div id="magnet-badge" class="badge">🧲 МАГНИТ: <span id="magnet-time">0</span>с</div>
    <div id="shield-badge" class="badge">🛡️ ЩИТ АКТИВЕН</div>
</div>

<button id="sound-btn" onclick="toggleAudio()">🔊 ЗВУК: ВКЛ</button>

<div id="game-over">
    <h1>СБОЙ СИСТЕМЫ</h1>
    <p>Дистанция: <span id="final-score">0</span> м</p>
    <p>Собрано монет: <span id="final-coins">0</span></p>
    <button class="restart-btn" onclick="resetGame()">ПЕРЕЗАПУСК</button>
</div>

<script>
    // --- СИНТЕЗАТОР ЗВУКА И МУЗЫКИ (WEB AUDIO API) ---
    let audioCtx = null;
    let soundEnabled = true;
    let musicInterval = null;
    let beatStep = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startSynthwaveMusic();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleAudio() {
        initAudio();
        soundEnabled = !soundEnabled;
        document.getElementById('sound-btn').innerText = soundEnabled ? '🔊 ЗВУК: ВКЛ' : '🔇 ЗВУК: ВЫКЛ';
    }

    function playSound(type) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(520, now + 0.18);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'coin') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.setValueAtTime(1320, now + 0.06);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'swipe') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'powerup') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(330, now);
            osc.frequency.setValueAtTime(440, now + 0.08);
            osc.frequency.setValueAtTime(660, now + 0.16);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(35, now + 0.4);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    function startSynthwaveMusic() {
        const bassNotes = [55, 55, 65.41, 65.41, 73.42, 73.42, 49, 49];
        musicInterval = setInterval(() => {
            if (!soundEnabled || !audioCtx || isGameOver) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(bassNotes[beatStep % bassNotes.length], now);
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(320, now);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.005, now + 0.22);
            osc.start(now);
            osc.stop(now + 0.22);
            beatStep++;
        }, 240);
    }

    // --- ПРОЦЕДУРНЫЕ ТЕКСТУРЫ (ИСПРАВЛЕНО) ---
    function createRoadTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#181c28';
        ctx.fillRect(0, 0, 512, 512);

        const laneCenters =;
        laneCenters.forEach(cx => {
            ctx.fillStyle = '#252a3a';
            for (let y = 0; y < 512; y += 32) ctx.fillRect(cx - 45, y, 90, 14);
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(cx - 30, 0, 6, 512);
            ctx.fillRect(cx + 24, 0, 6, 512);
            ctx.fillStyle = 'rgba(0, 255, 204, 0.35)';
            ctx.fillRect(cx - 28, 0, 2, 512);
            ctx.fillRect(cx + 26, 0, 2, 512);
        });
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(170, 0, 4, 512);
        ctx.fillRect(341, 0, 4, 512);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1, 22);
        return tex;
    }

    function createHazardTexture(color1, color2) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color1; ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = color2;
        for (let i = -256; i < 512; i += 40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 20, 0);
            ctx.lineTo(i - 100, 256); ctx.lineTo(i - 120, 256); ctx.closePath(); ctx.fill();
        }
        return new THREE.CanvasTexture(canvas);
    }

    // --- СЦЕНА И КАМЕРА ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e17);
    scene.fog = new THREE.FogExp2(0x0b0e17, 0.013);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 140);
    camera.position.set(0, 5.5, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Свет
    scene.add(new THREE.HemisphereLight(0x4facfe, 0x1a1a2e, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
