<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Runner 3D — Enhanced Graphics</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #090a0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 25px;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            z-index: 10;
            background: rgba(15, 20, 35, 0.6);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(5px);
        }
        #score-val { color: #00ffcc; font-size: 26px; }
        #coins-val { color: #ffd700; font-size: 26px; }
        
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(12, 14, 24, 0.92);
            border: 2px solid #ff2a6d;
            border-radius: 18px;
            padding: 35px 55px;
            text-align: center;
            color: white;
            z-index: 20;
            box-shadow: 0 0 40px rgba(255, 42, 109, 0.5);
            backdrop-filter: blur(8px);
        }
        #game-over h1 { margin-top: 0; color: #ff2a6d; letter-spacing: 2px; }
        button {
            background: linear-gradient(45deg, #00ffcc, #00b8ff);
            color: #090a0f;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        button:hover { box-shadow: 0 0 25px rgba(0, 255, 204, 0.8); }
        button:active { transform: scale(0.95); }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div id="ui">
    <div>СЧЁТ: <span id="score-val">0</span></div>
    <div>МОНЕТЫ: <span id="coins-val">0</span></div>
</div>

<div id="game-over">
    <h1>СБОЙ СИСТЕМЫ</h1>
    <p>Дистанция: <span id="final-score">0</span> м</p>
    <p>Собрано монет: <span id="final-coins">0</span></p>
    <button onclick="resetGame()">ПЕРЕЗАПУСК</button>
</div>

<script>
    // --- ГЕНЕРАТОР ПРОЦЕДУРНЫХ ТЕКСТУР ---
    function createRoadTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // Асфальт / бетон
        ctx.fillStyle = '#181c28';
        ctx.fillRect(0, 0, 512, 512);

        // Шум зернистости
        for (let i = 0; i < 4000; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.08)';
            ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
        }

        // Шпалы и рельсы для 3 полос
        const laneCenters =;
        laneCenters.forEach(cx => {
            // Шпалы
            ctx.fillStyle = '#252a3a';
            for (let y = 0; y < 512; y += 32) {
                ctx.fillRect(cx - 45, y, 90, 14);
            }
            // Металлические рельсы
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(cx - 30, 0, 6, 512);
            ctx.fillRect(cx + 24, 0, 6, 512);
            // Неоновый блик на рельсах
            ctx.fillStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.fillRect(cx - 28, 0, 2, 512);
            ctx.fillRect(cx + 26, 0, 2, 512);
        });

        // Разделительные неоновые линии
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(170, 0, 4, 512);
        ctx.fillRect(341, 0, 4, 512);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1, 20);
        return tex;
    }

    function createHazardTexture(color1, color2) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = color1;
        ctx.fillRect(0, 0, 256, 256);

        ctx.fillStyle = color2;
        for (let i = -256; i < 512; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i + 20, 0);
            ctx.lineTo(i - 100, 256);
            ctx.lineTo(i - 120, 256);
            ctx.closePath();
            ctx.fill();
        }
        return new THREE.CanvasTexture(canvas);
    }

    // --- НАСТРОЙКА СЦЕНЫ И РЕНДЕРА ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e17);
    scene.fog = new THREE.FogExp2(0x0b0e17, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 5.2, 8.5);
    camera.lookAt(0, 1.2, -10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- ОСВЕЩЕНИЕ ---
    const hemiLight = new THREE.HemisphereLight(0x4facfe, 0x1a1a2e, 0.7);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(12, 25, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 60;
    const d = 15;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // Неоновая подсветка снизу от дороги
    const underLight = new THREE.PointLight(0x00ffcc, 1.2, 15);
    underLight.position.set(0, 1, 0);
    scene.add(underLight);

    // --- ДОРОГА И ОКРУЖЕНИЕ ---
    const LANES = [-2.6, 0, 2.6];
    const roadTex = createRoadTexture();
    const roadGeo = new THREE.PlaneGeometry(8.5, 220);
    const roadMat = new THREE.MeshStandardMaterial({ 
        map: roadTex, 
        roughness: 0.6, 
        metalness: 0.2 
    });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -90;
    road.receiveShadow = true;
    scene.add(road);

    // Боковые бордюры
    const curbGeo = new THREE.BoxGeometry(0.5, 0.4, 220);
    const curbMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x005544 });
    [-4.5, 4.5].forEach(x => {
        const curb = new THREE.Mesh(curbGeo, curbMat);
        curb.position.set(x, 0.2, -90);
        scene.add(curb);
    });

    // Здания и фонари по бокам (декорации)
    const props = [];
    const buildingColors = [0x14192b, 0x1c233d, 0x0f1322];
    const neonAccents = [0x00ffcc, 0xff2a6d, 0x05d9e8, 0xff9f1c];

    function spawnProp(zPos) {
        [-1, 1].forEach(side => {
            const height = 8 + Math.random() * 18;
            const width = 4 + Math.random() * 4;
            const depth = 5 + Math.random() * 5;
            
            const bGeo = new THREE.BoxGeometry(width, height, depth);
            const bMat = new THREE.MeshStandardMaterial({ 
                color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
                roughness: 0.4,
                metalness: 0.6
            });
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set(side * (7.5 + width / 2 + Math.random() * 2), height / 2 - 0.5, zPos);
            
            // Неоновая полоса на здании
            const stripGeo = new THREE.BoxGeometry(0.15, height * 0.8, 0.15);
            const accentColor = neonAccents[Math.floor(Math.random() * neonAccents.length)];
            const stripMat = new THREE.MeshBasicMaterial({ color: accentColor });
            const strip = new THREE.Mesh(stripGeo, stripMat);
            strip.position.set(-side * (width / 2 + 0.05), 0, depth / 2 - 0.2);
            building.add(strip);

            scene.add(building);
            props.push(building);
        });
    }
    for (let z = 10; z > -110; z -= 12) spawnProp(z);

    // --- СБОРКА АНИМИРОВАННОГО ПЕРСОНАЖА ---
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.5 });
    const jacketMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3, metalness: 0.2 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e2436, roughness: 0.7 });
    const visorMat = new THREE.MeshStandardMaterial({ color: 0xff2a6d, emissive: 0xff2a6d, emissiveIntensity: 0.8 });

    // Тело
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.85, 0.4), jacketMat);
    torso.position.y = 1.15;
    torso.castShadow = true;
    playerGroup.add(torso);

    // Рюкзак
    const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.25), pantsMat);
    backpack.position.set(0, 1.18, 0.3);
    playerGroup.add(backpack);

    // Голова и кибер-визор
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skinMat);
    head.position.y = 1.88;
    head.castShadow = true;
    playerGroup.add(head);

    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.16, 0.3), visorMat);
